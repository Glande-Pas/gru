[project]
name = "Gru"
version = "0.0.0"
authors = [{name="Cimbali", email="me@cimba.li" }]
description = "Greates Resolving Updater for MMO addons"
readme = "README.md"
dependencies = ["requests", "requests-cache", "click", "unicodedata2"]
requires-python = ">=3.8"

[project.scripts]
gru = "gru.cli:main"

[options]
packages = ["gru"]

[build-system]
requires = [
  "setuptools >= 40.9.0",
  "wheel",
]
build-backend = "setuptools.build_meta"
